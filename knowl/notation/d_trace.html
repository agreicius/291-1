<article class="definition definition-like"><h4 class="heading">
<span class="type">Definition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">1.15.28</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Trace of a matrix.</span>
</h4>
<div class="para logical">
<div class="para">Let <span class="process-math">\(A\in \ML_{n,n}(F)\text{.}\)</span> The <dfn class="terminology">trace</dfn> of <span class="process-math">\(A\text{,}\)</span> denoted <span class="process-math">\(\tr A\)</span> is defined as the sum of the diagonal entries of <span class="process-math">\(A\text{:}\)</span> i.e.,</div>
<div class="displaymath process-math">
\begin{equation*}
\tr A=\sum_{i=1}^n [A]_{i,i}\text{.}
\end{equation*}
</div>
