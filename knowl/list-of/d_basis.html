<div class="para logical">
<div class="para">Let <span class="process-math">\(V\)</span> be an <span class="process-math">\(F\)</span>-vector space. A <dfn class="terminology">basis</dfn> of <span class="process-math">\(V\)</span> is a tuple of vectors <span class="process-math">\(B=(v_i)_{i\in I}\)</span> of <span class="process-math">\(V\)</span> satisfying the following properties.</div>
<ol class="decimal" id="d_basis-2-1-7">
<li>
<div class="para">
<span class="process-math">\(\Span B=V\text{.}\)</span><div class="autopermalink" data-description="Paragraph"><a href="#d_basis-2-1-7-1-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div class="autopermalink" data-description="Item 1"><a href="#d_basis-2-1-7-1" title="Copy heading and permalink for Item 1" aria-label="Copy heading and permalink for Item 1">🔗</a></div>
</li>
<li>
<div class="para">
<span class="process-math">\(B\)</span> is linearly independent.<div class="autopermalink" data-description="Paragraph"><a href="#d_basis-2-1-7-2-1" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
