</h4>
<div class="para">We use <code class="code-inline tex2jax_ignore">+</code> and <code class="code-inline tex2jax_ignore">*</code> for matrix addition and multiplication.<div class="autopermalink" data-description="Paragraph"><a href="#ss_matrix_mult-9-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div id="ss_matrix_mult-9-3" class="ptx-sagecell sagecell-sage"><script type="text/x-sage">A=Matrix(4,3,range(12))
B=Matrix(4,3,range(12,24))
C=Matrix(3,5,range(-5,10))
show(A,B,C)
show(A+B)
show(A*C)
</script></div>
<div class="para">As evidence of Sage’s flexibility, the same symbol <code class="code-inline tex2jax_ignore">*</code> is also used for scalar multiplication.<div class="autopermalink" data-description="Paragraph"><a href="#ss_matrix_mult-9-4" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>
</div>
<div id="ss_matrix_mult-9-5" class="ptx-sagecell sagecell-sage"><script type="text/x-sage">show(5*A*C-2*B*C)
</script></div>
